# Selected only when XDG_CURRENT_DESKTOP includes AeroShell.
# GTK supplies generic dialogs without inheriting Plasma's portal defaults.
# KWin's KDE backend supplies compositor-integrated Wayland capture APIs.
[preferred]
default=gtk
org.freedesktop.impl.portal.ScreenCast=kde;gtk
org.freedesktop.impl.portal.Screenshot=kde;gtk
org.freedesktop.impl.portal.RemoteDesktop=kde
org.freedesktop.impl.portal.InputCapture=kde
org.freedesktop.impl.portal.GlobalShortcuts=kde
